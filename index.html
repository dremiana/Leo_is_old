<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Лёня, старый айтишник 🎂</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{
  min-height:100vh; overflow-x:hidden; color:#fff;
  background:
    radial-gradient(circle at 15% 15%,rgba(255,90,170,.25),transparent 30%),
    radial-gradient(circle at 85% 10%,rgba(80,150,255,.22),transparent 30%),
    radial-gradient(circle at 50% 100%,rgba(160,80,255,.2),transparent 35%),
    linear-gradient(135deg,#151329,#211a3b 50%,#101725);
  display:flex;justify-content:center;align-items:center;padding:28px 16px;
}
#app{width:min(760px,100%);position:relative;z-index:2}
.stars{position:fixed;inset:0;pointer-events:none}
.star{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;animation:twinkle 2s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.2;transform:scale(.6)}50%{opacity:1;transform:scale(1.5)}}
.card{
  padding:42px 38px;border:1px solid rgba(255,255,255,.17);border-radius:30px;
  background:rgba(255,255,255,.09);backdrop-filter:blur(18px);
  box-shadow:0 30px 80px rgba(0,0,0,.38);text-align:center;
  animation:appear .55s ease-out;
}
@keyframes appear{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}
h1{
  font-size:clamp(32px,7vw,58px);line-height:1.05;margin:0 0 20px;
  letter-spacing:-2px;background:linear-gradient(90deg,#fff,#ffd0e7,#cbd9ff,#fff);
  background-size:250% auto;-webkit-background-clip:text;background-clip:text;color:transparent;
  animation:shine 5s linear infinite;
}
@keyframes shine{to{background-position:250% center}}
h2{font-size:30px;margin:0 0 18px}
p{font-size:18px;line-height:1.7;color:rgba(255,255,255,.84)}
.poem{text-align:left;font-size:18px;line-height:1.75}
.highlight{color:#ffd1e7;font-weight:700}
button{
  border:0;border-radius:999px;padding:15px 27px;margin:10px 7px;
  font-size:17px;font-weight:750;color:#27182b;cursor:pointer;
  background:linear-gradient(135deg,#ffd0e5,#cbd9ff);
  box-shadow:0 10px 28px rgba(180,150,255,.25);transition:.2s;
}
button:hover{transform:translateY(-3px) scale(1.03)}
button:active{transform:scale(.97)}
.danger{background:linear-gradient(135deg,#ffb7c9,#ffd3a8)}
.choice{min-height:52px;min-width:190px}
#message{min-height:28px;color:#ffd0e7;font-weight:700;margin:15px 0}
.game-text{font-size:20px}
.answer{
  text-align:left;margin:14px 0;padding:19px 20px;border-radius:18px;
  background:rgba(0,0,0,.16);border:1px solid rgba(255,255,255,.1);
}
.answer button{width:100%;margin:7px 0}
.result{font-size:22px;font-weight:800;min-height:34px;margin:14px 0}
.score{font-size:14px;color:rgba(255,255,255,.5)}
.girls{font-size:78px;line-height:1.3;margin:20px 0}
.city-wrap{position:relative;min-height:180px;margin-top:15px}
#hcm{position:absolute;left:52%;top:65px}
#danang{position:relative}
.small{font-size:14px;color:rgba(255,255,255,.5)}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:10}
.piece{position:fixed;top:-20px;width:9px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translate3d(var(--x),110vh,0) rotate(720deg);opacity:0}}
@media(max-width:600px){.card{padding:34px 20px}.poem,p{font-size:16px}h2{font-size:25px}}
.gemini-link{
  display:inline-block;
  margin:18px 0 8px;
  padding:12px 20px;
  border-radius:999px;
  color:#fff;
  text-decoration:none;
  background:rgba(255,255,255,.12);
  border:1px solid rgba(255,255,255,.18);
  transition:.2s;
}
.gemini-link:hover{
  transform:translateY(-2px);
  background:rgba(255,255,255,.18);
}
</style>
</head>
<body>
<div class="stars" id="stars"></div>
<div class="confetti" id="confetti"></div>
<div id="app"></div>

<script>
const app=document.getElementById('app');

const game=[
  {
    text:`Леонид, наш любимый серб

Твои айти навыки не просто навыки, а новый уровень в кодировании этой жизни. Имея зарплату до пупа, ты решил все равно не выходить из дома, чтобы менять ЗПшку на монетки и спать на них

Поэтому, пожелаю тебе ещё одну футболку, одну пару штанов. Ну и хватит ещё на пять лет. Больше монеток в гору монет`,
    answer:"human"
  },
  {
    text:`Леня, брат, с днюхой тебя!!! 🎉

Желаю тебе, чтобы вообще всё было заебись 😄 Чтобы работа продолжала приносить тебе не только дохера денег, но и кайф, чтобы проекты были интересные, начальство не ебало мозги, а зарплата почему-то каждый год становилась всё больше и больше, хотя казалось бы, куда уже 😂

Ты вообще красавчик, конечно. Супер-крутой айтишник, живёшь в Сербии, работаешь в большом Я, снимаешь на Новый год какие-то нереально крутые видосы — короче, жизнь у тебя выглядит так, будто ты уже прошёл игру на максимальной сложности и теперь просто собираешь бонусы 😁

Но самое главное — здоровья тебе, счастья, нормальных людей рядом и чтобы всё, что ты задумал, реально получалось. Ну и путешествий побольше, потому что сидеть на одном месте с такими возможностями было бы странно))

Мы тебя очень-очень любим и, блин, реально соскучились. Уже хочется нормально увидеться, посидеть, поржать, выпить и обсудить вообще всю эту хуйню, которая в жизни происходит 😄

Короче, будь счастлив, богат, успешен и охуенен, как ты умеешь. С днём рождения, брат ❤️`,
    answer:"ai"
  },
  {
    text:`Лееня, поздравлямбы!!!

Может ли робот может написать поздравление? Человеку впадлу

Чем ты старше и синьеристее, тем мы ближе к порабощению чат ботами летуаля. Когда они до нас доберутся, скажем, что ты у нас на надувном матрасе спал, может разрешат работать сантехниками`,
    answer:"human"
  },
  {
    text:`Привет, Леня! Короче, блин, с Новым годом тебя!

Капец как мы по тебе все тут соскучились, реально! Сто лет уже не виделись, вообще жесть. Ты там в своей Сербии, типа, совсем пропал, но мы-то знаем, что ты чисто лучший, типа супергерой в мире IT. Короче, то, что ты в Яндексе работаешь на такой жирной зэпке — это просто вау, завидуем по-белому, блин.

И короче, елки-палки, мы все в шоке от твоих новогодних видосов каждый раз — ну это же реально уровень какого-то голливудского кинца, капец как круто монтируешь! Короче, чувак, желаем тебе, чтобы код компилился с первого раза, багов вообще ноль, ну и чтобы эта самая сербская атмосфера кайф приносила каждый день.

Короче, типа, ждём на связи и давай уже как-нибудь пересечемся, а то вообще капец. С праздником, бро! 🍻`,
    answer:"ai"
  },
 {
    text:`Леняяяяя

Вот он я, нейропоздравитель

Открыток отправитель, видео не хотеть снииатель, но по ним скучатель. Я машина, я машина

И я на нейро сайте, оу нет

Мы и машину тебя любим

Ты крутой и веселый

Будешь помогать нашим младшим братьям тостерам в будущем

Гулять и веселится с тобой, вот чего мы желаем

Видеть в нашем коде, часть твоего, сделаного в нейронке, но по твоим запросам

Слушать и смотреть твои фильмы с креативным подходом и крутыми шутками

И придумывать как поздравлять тебя каждый год

Пока машины позволяют, с днюхой, ОлдБой`,
    answer:"human"
  }
];

let level=0;

function render(html){
  app.innerHTML='<div class="card">'+html+'</div>';
  window.scrollTo({top:0,behavior:'smooth'});
}

function confetti(){
  const box=document.getElementById('confetti');
  for(let i=0;i<100;i++){
    const x=document.createElement('span');x.className='piece';
    x.style.left=(45+Math.random()*10)+'%';
    x.style.setProperty('--x',(Math.random()*100-50)+'vw');
    x.style.animationDuration=(2+Math.random()*2.5)+'s';
    x.style.background=['#ffd1e7','#cbd9ff','#fff','#f9c74f','#b8f2e6'][Math.floor(Math.random()*5)];
    box.appendChild(x);setTimeout(()=>x.remove(),5000);
  }
}

function intro(){
render(`
  <div style="font-size:70px">🧙‍♂️</div>
  <h1>Лёня, старый айтишник</h1>
  <div class="poem">
    <p><span class="highlight">Король нейрослопа</span> и конторы интересных людей.</p>
    <p>Наш Гендальф для айти, мы идём за тобой по тропе, но как Хоббиты — маленькими шагами.</p>
    <p>Пока ты катаешься на Я.лошадях и пьёшь свой раф,<br>
    а мы сквозь горы и орков лезем в горы, пока ты мог туда на орлах.</p>
    <p>Это я к чему?</p>
    <p class="highlight">Вайб кодддд.</p>
    <p>Как пелось в песне, которую я часто переслушиваю:</p>
    <p>«Вайб код, наше извращенное оружие, чтобы чуть-чуть стать ближе к тебе в этой кодовой магии. Тупая геометрия».</p>
  </div>
  <button onclick="summon()">🎂 Дальше</button>
`);
}

function summon(){
render(`
  <div style="font-size:70px">📬</div>
  <h2>Нажмёшь сюда — придёт повестка</h2>
  <p>Ты уверен, что хочешь продолжить?</p>
  <button class="danger" onclick="gameIntro()">😈 Нажимаю</button>
`);
}

function gameIntro(){
render(`
  <div style="font-size:70px">🧠</div>
  <h2>Умеешь ты ещё отличать человеческие старания?</h2>
  <p class="game-text">Перед тобой поздравления.<br>
  Одно написал <b>человекослоп</b>, другое — <b>нейрослоп</b>.<br><br>
  Угадай автора, чтобы пройти дальше.</p>
  <button onclick="startGame()">🎮 Начать игру</button>
`);
}

function startGame(){
 level=0; showQuestion();
}

function showQuestion(){
 const q=game[level];
 render(`
   <div class="score">Уровень ${level+1} / ${game.length}</div>
   <h2>Кто это написал?</h2>
   <div class="answer" style="white-space:pre-line; text-align:left;">«${q.text}»</div>
   <button onclick="answer('human')">👨‍💻 Человекослоп</button>
   <button onclick="answer('ai')">🤖 Нейрослоп</button>
   <div class="result" id="result"></div>
 `);
}

function answer(a){
 const result=document.getElementById('result');
 if(a!==game[level].answer){
   result.innerHTML='❌ -1 аниме тян';
   setTimeout(()=>showQuestion(),1100);
   return;
 }
 result.innerHTML='✅ Правильно!';
 confetti();
 level++;
 setTimeout(()=>{
   if(level<game.length) showQuestion();
   else finale();
 },900);
}

function finale(){
render(`
  <div class="girls">🌸 👩🏻‍💻 🌸 👩🏻‍🎤 🌸 👩🏻‍🎨 🌸</div>
  <h1>Ты победил!</h1>
  <p>Человеческие старания ещё не окончательно потеряны.</p>
  <p>За это тебе полагается главный приз:</p>
  <h2>аниме тянки ✨</h2>
  <button onclick="vietnam()">🇻🇳 Забрать приз</button>
`);
confetti();
}

function vietnam(){
render(`
  <div style="font-size:70px">🌴🇻🇳🌴</div>
  <h1>Приезжай к нам во Вьетнам!</h1>
  <p>Выбирай город. Только один вариант является правильным 😏</p>
  <div class="city-wrap">
    <button id="danang" class="choice" onclick="win()">🌊 Дананг</button>
    <button id="hcm" class="choice">🏙️ Хошимин</button>
  </div>
  <div id="message"></div>
`);
const h=document.getElementById('hcm');
h.addEventListener('mouseenter',escapeHcm);
h.addEventListener('touchstart',escapeHcm,{passive:true});
}

function escapeHcm(){
  const h=document.getElementById('hcm');

  const rect=h.getBoundingClientRect();

  const maxMoveX=100;
  const maxMoveY=70;

  const newX=Math.max(
    10,
    Math.min(
      window.innerWidth-rect.width-10,
      rect.left+(Math.random()*2-1)*maxMoveX
    )
  );

  const newY=Math.max(
    10,
    Math.min(
      window.innerHeight-rect.height-10,
      rect.top+(Math.random()*2-1)*maxMoveY
    )
  );

  h.style.position='fixed';
  h.style.left=newX+'px';
  h.style.top=newY+'px';

  document.getElementById('message').textContent='Не-не-не 😈 Хошимин не принимается!';
}

function win(){
  confetti();
  render(`
    <div style="font-size:85px">🌊🏝️🇻🇳</div>
    <h1>ДАНАНГ!</h1>
    <p>Вот теперь всё правильно.</p>
    <p class="highlight">Ждём тебя во Вьетнаме. Чемодан собирай, раф бери.</p>
    <div style="font-size:38px">🥳 🍜 🏖️ 🍹 🧙‍♂️</div>

    <a href="https://share.gemini.google/7E0NQ6kvjdml"
       target="_blank"
       class="gemini-link">
      История великой дружбы
    </a>

    <p class="small">Конец квеста. Но не конец приключений.</p>
  `);
}

for(let i=0;i<90;i++){
 const s=document.createElement('span');s.className='star';
 s.style.left=Math.random()*100+'%';s.style.top=Math.random()*100+'%';
 s.style.animationDelay=Math.random()*3+'s';document.getElementById('stars').appendChild(s);
}
intro();
</script>
</body>
</html>
